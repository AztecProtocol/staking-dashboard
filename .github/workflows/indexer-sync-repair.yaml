name: Indexer Sync Repair

# Runs atp-indexer/single-instance/scripts/sync-repair.sh on a single-instance box via SSM, for
# when a crash has left the shared ponder_sync cache with logs but no blocks ("Missing block N").
# Run `diagnose` first; it prints the MIN_BAD to pass to `repair`.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Box to run on"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - prod
      action:
        description: "diagnose: stop the builder and report missing blocks. repair: mark blocks from min_bad up as not cached"
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - repair
      min_bad:
        description: "repair only: first block to refetch (from the diagnose output)"
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  sync-repair:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENV: ${{ inputs.environment }}
      ACTION: ${{ inputs.action }}
      MIN_BAD: ${{ inputs.min_bad }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: ${{ github.run_id }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Run sync-repair.sh on the box via SSM
        run: |
          set -euo pipefail
          if [ "$ACTION" = "repair" ]; then
            [[ "$MIN_BAD" =~ ^[0-9]+$ ]] || { echo "repair needs min_bad as a block number" >&2; exit 1; }
            ARGS="repair $MIN_BAD"
          else
            ARGS="diagnose"
          fi
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=staking-dashboard-atp-single-instance-$ENV" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$IID" != "None" ] || { echo "no running box for env $ENV"; exit 1; }
          SCRIPT_B64=$(base64 -w0 atp-indexer/single-instance/scripts/sync-repair.sh)
          CMD_ID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters "$(jq -nc --arg b "$SCRIPT_B64" --arg args "$ARGS" \
              '{commands: [("echo "+$b+" | base64 -d > /opt/staking-dashboard-atp/sync-repair.sh"), "chmod +x /opt/staking-dashboard-atp/sync-repair.sh", ("/opt/staking-dashboard-atp/sync-repair.sh "+$args)], executionTimeout: ["1800"]}')" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          while :; do
            ST=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query Status --output text)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          [ "$ST" = "Success" ]
